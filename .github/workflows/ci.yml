# =============================================================================
# Continuous Integration Pipeline — retrieva FRONTEND (Next.js)
# =============================================================================
# Post-split (RFC #474): this repo is frontend-only; backend CI lives in
# andrelair-platform/retrieva-backend. Runs on PRs to main (+ dev pushes).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

env:
  NODE_VERSION: '20.x'

jobs:
  # Skip heavy jobs when a PR only touches docs/bmad markdown.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'frontend/**'
              - '**/Dockerfile'
              - 'Dockerfile*'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Run linting
        run: npm run lint --if-present
        working-directory: ./frontend
      - name: Run tests
        run: npm run test:coverage
        working-directory: ./frontend
      - name: Upload coverage report
        uses: codecov/codecov-action@v6
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./frontend/coverage
          flags: frontend
          fail_ci_if_error: true

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [changes, frontend-test]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: ./frontend
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./frontend
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3007/api/v1
          NEXT_PUBLIC_APP_NAME: Retrieva
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker Build Check (frontend)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: retrieva-frontend:test
          build-args: |
            NEXT_PUBLIC_APP_NAME=Retrieva
          cache-from: type=gha
          cache-to: type=gha,mode=max

  storybook-build:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Build Storybook
        run: npm run build-storybook
        working-directory: ./frontend

  ci-success:
    name: CI Success
    needs: [changes, frontend-test, docker-build, frontend-e2e, storybook-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          E2E_RESULT: ${{ needs.frontend-e2e.result }}
          STORYBOOK_RESULT: ${{ needs.storybook-build.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed (result=$CHANGES_RESULT)"; exit 1
          fi
          fail=0
          for name in FRONTEND DOCKER E2E STORYBOOK; do
            var="${name}_RESULT"; r="${!var}"
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "$name job did not pass (result=$r)"; fail=1
            fi
          done
          if [[ $fail -eq 0 ]]; then
            echo "All CI checks passed (heavy jobs skipped = no code change)."
          else
            exit 1
          fi
