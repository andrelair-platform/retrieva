# =============================================================================
# Release — release-please (retrieva frontend)
# =============================================================================
# On every push to main, release-please opens/updates a release PR that bumps
# package.json + CHANGELOG.md from conventional commits. Merging that PR creates
# the git tag (vX.Y.Z) + a GitHub Release. Zero manual steps — replaces the old
# manual tag-triggered flow that left releases stale (v1.0.0 for 4 months).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
